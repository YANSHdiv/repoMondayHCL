<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f7fb">
	<title>StudyFlow — Student Task Manager</title>
	<style>
		:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20243a;background:#f6f7fb;--purple:#6958d8;--muted:#73798e;--line:#e8eaf1;--surface:#fff}
		*{box-sizing:border-box}body{margin:0;min-width:320px;background:#f6f7fb}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(1080px,calc(100% - 36px));margin:auto;padding:30px 0 55px}
		.topbar,.brand,.list-head,.filters,.task-card,.task-title-line,.task-meta,.actions{display:flex;align-items:center}.topbar,.list-head{justify-content:space-between;gap:14px}.topbar{margin-bottom:29px}.brand{gap:11px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--purple);color:white;font-size:21px;font-weight:800}.brand-name{font-weight:750}.caption,.today,.subtitle,.hint,.stat-label{color:var(--muted)}.caption{font-size:12px;margin-top:2px}.today{font-size:13px}h1{font-size:clamp(27px,4vw,35px);letter-spacing:-1px;margin:0}.subtitle{font-size:14px;margin:8px 0 23px}
		.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px}.stat{display:flex;align-items:center;gap:13px;padding:16px}.stat-icon{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#f0edff;color:var(--purple);font-size:19px}.stat:nth-child(2) .stat-icon{background:#e9f7ef;color:#25885c}.stat:nth-child(3) .stat-icon{background:#fff3e6;color:#bd7625}.stat-value{font-size:21px;font-weight:750}.stat-label{font-size:12px;margin-top:3px}.workspace{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:19px;align-items:start}.form-panel,.list-panel{padding:21px}.panel-title{font-size:17px;margin:0 0 4px}.hint{font-size:12px;margin:0 0 17px}.field{margin-bottom:13px}label{display:block;font-size:12px;font-weight:650;color:#484d63;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #e1e3eb;border-radius:9px;background:white;color:#20243a;outline:0}input,select{height:40px;padding:0 10px}textarea{min-height:80px;padding:10px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6958d81c}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;height:42px;border:0;border-radius:9px;background:var(--purple);color:white;font-weight:650}.primary:hover{background:#5644c6}.cancel{width:100%;margin-top:8px;border:0;background:transparent;color:var(--muted);padding:7px}.filters{gap:8px}.filters select{width:auto;min-width:120px;height:36px;padding:0 8px;font-size:12px}.list-title{font-size:18px;margin:0}.count{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}.task-list{display:grid;gap:10px;margin-top:17px}.task-card{align-items:flex-start;gap:11px;padding:14px;border:1px solid var(--line);border-radius:12px}.task-card:hover{border-color:#d4cff5}.task-card.completed{background:#fbfcfd}.check{width:21px;height:21px;flex:0 0 21px;margin-top:1px;border:1.5px solid #c8cad5;border-radius:7px;background:white;color:white}.completed .check{background:#25885c;border-color:#25885c}.task-content{min-width:0;flex:1}.task-title-line{gap:7px;flex-wrap:wrap}.task-title{margin:0;font-size:14px;overflow-wrap:anywhere}.completed .task-title{color:#858a99;text-decoration:line-through}.description{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.task-meta{flex-wrap:wrap;gap:8px;margin-top:9px}.badge{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.high{background:#fff0ef;color:#bd4c48}.medium{background:#fff5e8;color:#a56a1b}.low{background:#eaf6ef;color:#3c855c}.due{font-size:11px;color:var(--muted)}.overdue{color:#c5525c;font-weight:650}.actions{gap:2px;margin:-3px -5px 0 0}.icon-btn{display:grid;place-items:center;width:31px;height:31px;border:0;border-radius:8px;background:transparent;color:#8b90a1;font-size:16px}.icon-btn:hover{background:#f1efff;color:var(--purple)}.icon-btn.delete:hover{background:#fff0ef;color:#c5525c}.empty{text-align:center;padding:42px 12px}.empty-mark{font-size:25px;color:var(--purple);margin-bottom:9px}.empty h3{font-size:15px;margin:0}.empty p{font-size:12px;color:var(--muted);margin:6px 0 0}.toast{position:fixed;right:20px;bottom:20px;padding:11px 15px;background:#25283a;color:white;border-radius:9px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}[hidden]{display:none!important}
		@media(max-width:740px){.app{width:min(100% - 28px,600px);padding-top:20px}.workspace{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:12px;gap:9px}.stat-icon{width:34px;height:34px;flex-basis:34px}.stat-value{font-size:18px}.stat-label{font-size:10px}}
		@media(max-width:480px){.app{width:calc(100% - 22px)}.topbar{margin-bottom:22px}.today{font-size:11px}.stats{gap:7px}.stat{display:block;padding:10px 8px}.stat-icon{margin-bottom:6px}.list-panel{padding:15px 11px}.list-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters select{flex:1;min-width:0}.task-card{padding:11px 9px;gap:8px}}
		@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
	</style>
</head>
<body>
	<main class="app">
		<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">✓</div><div><div class="brand-name">StudyFlow</div><div class="caption">Your academic planner</div></div></div><div class="today" id="today"></div></header>
		<section aria-labelledby="page-title"><h1 id="page-title">Your study space</h1><p class="subtitle">Keep your coursework organized and make today count.</p></section>
		<section class="stats" aria-label="Task summary"><div class="stat"><div class="stat-icon" aria-hidden="true">▤</div><div><div class="stat-value" id="total">0</div><div class="stat-label">Total tasks</div></div></div><div class="stat"><div class="stat-icon" aria-hidden="true">✓</div><div><div class="stat-value" id="done">0</div><div class="stat-label">Completed</div></div></div><div class="stat"><div class="stat-icon" aria-hidden="true">◷</div><div><div class="stat-value" id="due-today">0</div><div class="stat-label">Due today</div></div></div></section>
		<section class="workspace">
			<form class="panel form-panel" id="task-form"><h2 class="panel-title" id="form-title">Add a task</h2><p class="hint" id="form-hint">A little progress adds up.</p>
				<div class="field"><label for="title">Task title</label><input id="title" name="title" maxlength="100" placeholder="e.g. Read chapter 4" required></div>
				<div class="field"><label for="description">Description <span style="font-weight:400;color:#8b90a1">(optional)</span></label><textarea id="description" name="description" maxlength="500" placeholder="Add a few details..."></textarea></div>
				<div class="two-fields"><div class="field"><label for="due-date">Due date</label><input id="due-date" name="due" type="date"></div><div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></div></div>
				<button class="primary" id="submit" type="submit">＋ Add task</button><button class="cancel" id="cancel" type="button" hidden>Cancel editing</button>
			</form>
			<section class="panel list-panel" aria-labelledby="list-title"><div class="list-head"><h2 class="list-title" id="list-title">My tasks <span class="count" id="count"></span></h2><div class="filters" aria-label="Filter tasks"><select id="status" aria-label="Filter by completion status"><option value="all">All tasks</option><option value="active">To do</option><option value="completed">Completed</option></select><select id="priority-filter" aria-label="Filter by priority"><option value="all">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div></div><div class="task-list" id="task-list" aria-live="polite"></div></section>
		</section>
	</main>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script>
		(()=>{
			const KEY='studyflow-tasks-v1',$=id=>document.getElementById(id),form=$('task-form');let tasks=[],editing=null,toastTimer;
			try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string')}catch{}
			const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
			$('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
			function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{notify('Unable to save tasks in this browser.')}}
			function notify(text){const box=$('toast');box.textContent=text;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2300)}
			function element(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
			function action(text,symbol,cls,fn){const b=element('button',`icon-btn ${cls||''}`,symbol);b.type='button';b.title=text;b.setAttribute('aria-label',text);b.addEventListener('click',fn);return b}
			function dateLabel(value){if(!value)return '';const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
			function render(){
				const completed=tasks.filter(t=>t.completed).length;$('total').textContent=tasks.length;$('done').textContent=completed;$('due-today').textContent=tasks.filter(t=>!t.completed&&t.due===today()).length;
				const shown=tasks.filter(t=>($('status').value==='all'||($('status').value==='completed'?t.completed:!t.completed))&&($('priority-filter').value==='all'||t.priority===$('priority-filter').value)).sort((a,b)=>Number(a.completed)-Number(b.completed)||(a.due&&b.due?a.due.localeCompare(b.due):a.due?-1:b.due?1:(b.createdAt||0)-(a.createdAt||0)));
				$('count').textContent=`${shown.length} ${shown.length===1?'task':'tasks'}`;const root=$('task-list');root.replaceChildren();
				if(!shown.length){const box=element('div','empty'),mark=element('div','empty-mark',tasks.length?'⌕':'✓'),heading=element('h3','',tasks.length?'No tasks match these filters':'A clear plan starts here'),text=element('p','',tasks.length?'Try changing your filters to see more tasks.':'Add your first task and keep your studies on track.');mark.setAttribute('aria-hidden','true');box.append(mark,heading,text);root.append(box);return}
				shown.forEach(task=>{const card=element('article',`task-card${task.completed?' completed':''}`),check=element('button','check',task.completed?'✓':'');check.type='button';check.setAttribute('aria-label',`${task.completed?'Mark':'Mark'} ${task.title} as ${task.completed?'not completed':'completed'}`);check.addEventListener('click',()=>{task.completed=!task.completed;persist();render();notify(task.completed?'Task completed.':'Task moved back to to do.')});
					const content=element('div','task-content'),titleLine=element('div','task-title-line'),title=element('h3','task-title',task.title),meta=element('div','task-meta');titleLine.append(title);content.append(titleLine);
					if(task.description)content.append(element('p','description',task.description));const level=['high','medium','low'].includes(task.priority)?task.priority:'medium';meta.append(element('span',`badge ${level}`,`${level[0].toUpperCase()+level.slice(1)} priority`));
					if(task.due){const overdue=!task.completed&&task.due<today();meta.append(element('span',`due${overdue?' overdue':''}`,`${overdue?'Overdue · ':'Due '}${dateLabel(task.due)}`))}content.append(meta);
					const actions=element('div','actions');actions.append(action('Edit task','✎','',()=>edit(task)),action('Delete task','×','delete',()=>remove(task)));card.append(check,content,actions);root.append(card)
				})
			}
			function reset(){form.reset();editing=null;$('form-title').textContent='Add a task';$('form-hint').textContent='A little progress adds up.';$('submit').textContent='＋ Add task';$('cancel').hidden=true}
			function edit(task){editing=task.id;$('title').value=task.title;$('description').value=task.description||'';$('due-date').value=task.due||'';$('priority').value=task.priority||'medium';$('form-title').textContent='Edit task';$('form-hint').textContent='Update the details for this task.';$('submit').textContent='Save changes';$('cancel').hidden=false;$('title').focus();form.scrollIntoView({behavior:'smooth',block:'start'})}
			function remove(task){if(!confirm(`Delete “${task.title}”? This cannot be undone.`))return;tasks=tasks.filter(t=>t.id!==task.id);if(editing===task.id)reset();persist();render();notify('Task deleted.')}
			form.addEventListener('submit',event=>{event.preventDefault();const title=$('title').value.trim();if(!title){$('title').focus();return}const fields={title,description:$('description').value.trim(),due:$('due-date').value,priority:$('priority').value};if(editing){const task=tasks.find(t=>t.id===editing);if(task)Object.assign(task,fields);notify('Task updated.')}else{const id=window.crypto?.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;tasks.unshift({id,...fields,completed:false,createdAt:Date.now()});notify('Task added to your list.')}persist();reset();render()});
			$('cancel').addEventListener('click',reset);$('status').addEventListener('change',render);$('priority-filter').addEventListener('change',render);render()
		})();
	</script>
</body>
</html>
